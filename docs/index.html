<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#382c22">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Handbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="prefs.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <a class="home" href="#g" aria-label="Handbook home">Handbook</a>
    <div class="search">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Search guides and items" aria-label="Search guides and items">
    </div>
    <button id="prefs-btn" class="icon-btn" type="button" aria-expanded="false" aria-controls="prefs"
            aria-label="Reading settings">Aa</button>
  </div>
  <div id="prefs" class="prefs" hidden>
    <div class="pref">
      <span class="pref-label">Font</span>
      <div class="seg" role="group" aria-label="Font">
        <button type="button" data-pref="font" data-val="std">Standard</button>
        <button type="button" data-pref="font" data-val="dys">Dyslexic</button>
      </div>
    </div>
    <div class="pref">
      <span class="pref-label">Text size</span>
      <div class="seg" role="group" aria-label="Text size">
        <button type="button" data-step="-1" aria-label="Smaller text">A&minus;</button>
        <button type="button" data-step="0" aria-label="Default text size">Reset</button>
        <button type="button" data-step="1" aria-label="Larger text">A+</button>
      </div>
    </div>
    <div class="pref">
      <span class="pref-label">Colours</span>
      <div class="seg" role="group" aria-label="Colours">
        <button type="button" data-pref="theme" data-val="auto">Auto</button>
        <button type="button" data-pref="theme" data-val="dark">Dark</button>
        <button type="button" data-pref="theme" data-val="light">Light</button>
      </div>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"><p class="note">Loading the handbook&hellip;</p></main>
<footer id="foot" class="foot"></footer>
<noscript><p class="note">This handbook needs JavaScript to show its pages.</p></noscript>
<script src="app.js"></script>
</body>
</html>
